plugins {
    id 'com.vanniktech.maven.publish.base' version '0.37.0' apply false
}

group = 'com.luokuiai.liquibase'
version = findProperty('releaseVersion') ?: '1.0.0-SNAPSHOT'

ext {
    liquibaseVersion = findProperty('liquibaseVersion') ?: '5.0.3'
    testcontainersVersion = '2.0.5'
}

subprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }
}
